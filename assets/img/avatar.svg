  <circle cx="128" cy="128" r="110" fill="none" stroke="#fff" stroke-opacity=".2" stroke-width="2"/>
  <text x="128" y="151" fill="#fff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="70" font-weight="700" letter-spacing="-5" text-anchor="middle">TB</text>
