<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title description">
  <title id="title">Trev</title>
  <desc id="description">A blue circular monogram with the letters TB.</desc>
  <defs>
    <linearGradient id="background" x1="28" y1="24" x2="224" y2="232" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#03045e"/>
      <stop offset="0.48" stop-color="#0077b6"/>
      <stop offset="1" stop-color="#48cae4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(194 48) rotate(132) scale(164)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#caf0f8" stop-opacity=".55"/>
